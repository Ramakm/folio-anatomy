<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plate II</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a museum exhibition wall. One mounted plate, a catalogue key beside it, then wall texts below. */
:root {
  --ground: #E5E1DA; --paper: #F5F2ED; --ink: #1F1C18; --ink-2: #554F46; --ink-3: #857E73; --rule: #C8C1B5; --accent: #C9381D; --accent-soft: rgba(201,56,29,.12);
  --top: #FCFAF6; --s3: #ECE7DF; --s2: #DED8CE; --s1: #CFC8BB; --s0: #BCB4A6; --cyl: #E6E1D8; --line: #2B2722; --lo: #7A7266; --faint: #B3AB9D;
  --hatch: #3F3932; --hatch-op: .5; --glass: #DDE4E3; --glass-line: #5D6A6B; --face: #FFFDF8; --brass: #DCD1BB;
  --fluid: #C9381D; --fluid-2: #DF6A50; --fluid-3: #D24B2F; --fluid-top: #EE9078; --fluid-deep: #8E2412; --shut: #8A8276; --light-blend: normal;
  --venous: #3E4C84; --venous-top: #7180B6; --venous-deep: #232C55;
  --water: #8FB3C4; --water-top: #B9D3DE; --water-deep: #4D7487; --copper: #B8794A; --copper-top: #D9A47A; --copper-deep: #6E4123; --iron: #7E8188; --lamp: #F2B544;
  --display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --body: "Source Serif 4", "Source Serif Pro", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ground: #151412; --paper: #1D1B19; --ink: #EDE8E0; --ink-2: #B3AB9F; --ink-3: #7F786E; --rule: #393531; --accent: #F0583C; --accent-soft: rgba(240,88,60,.16);
  --top: #3D3934; --s3: #35312D; --s2: #2D2A27; --s1: #262421; --s0: #201E1C; --cyl: #34312D; --line: #D9D2C6; --lo: #8F877B; --faint: #4F4A44;
  --hatch: #D8D0C3; --hatch-op: .26; --glass: #273032; --glass-line: #93A4A5; --face: #2D2A26; --brass: #4A4234;
  --fluid: #E2482B; --fluid-2: #F07A60; --fluid-3: #E85A3D; --fluid-top: #FF9C82; --fluid-deep: #9C2A16; --shut: #5C564E; --light-blend: screen;
  --venous: #5D6FBE; --venous-top: #95A2DC; --venous-deep: #2B3466;
  --water: #3F6A7E; --water-top: #6E98AA; --water-deep: #1F3A47; --copper: #C2814F; --copper-top: #E0A97C; --copper-deep: #6A3E20; --iron: #5D6068; --lamp: #FFC657;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --ground: #151412; --paper: #1D1B19; --ink: #EDE8E0; --ink-2: #B3AB9F; --ink-3: #7F786E; --rule: #393531; --accent: #F0583C; --accent-soft: rgba(240,88,60,.16);
  --top: #3D3934; --s3: #35312D; --s2: #2D2A27; --s1: #262421; --s0: #201E1C; --cyl: #34312D; --line: #D9D2C6; --lo: #8F877B; --faint: #4F4A44;
  --hatch: #D8D0C3; --hatch-op: .26; --glass: #273032; --glass-line: #93A4A5; --face: #2D2A26; --brass: #4A4234;
  --fluid: #E2482B; --fluid-2: #F07A60; --fluid-3: #E85A3D; --fluid-top: #FF9C82; --fluid-deep: #9C2A16; --shut: #5C564E; --light-blend: screen;
  --venous: #5D6FBE; --venous-top: #95A2DC; --venous-deep: #2B3466;
  --water: #3F6A7E; --water-top: #6E98AA; --water-deep: #1F3A47; --copper: #C2814F; --copper-top: #E0A97C; --copper-deep: #6A3E20; --iron: #5D6068; --lamp: #FFC657;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6; margin: 0; padding-inline: clamp(16px, 4vw, 56px); padding-block: 0 64px; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1240px; margin: 0 auto; }
.mono { font-family: var(--mono); font-feature-settings: "zero" 0; }
.label { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
a { color: inherit; text-decoration-color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* Masthead */
.mast { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding-block: 22px 18px; border-bottom: 1px solid var(--rule); }
.mast .mark { font-family: var(--display); font-size: 22px; letter-spacing: .32em; text-transform: uppercase; font-weight: 500; justify-self: center; }
.mast .r { justify-self: end; text-align: right; }

/* Title block */
.title { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 360px); gap: 24px 64px; align-items: end; padding-block: 52px 36px; }
.title h1 { font-family: var(--display); font-weight: 400; font-size: clamp(44px, 7.4vw, 104px); line-height: .94; letter-spacing: -.02em; margin: 14px 0 0; text-wrap: balance; }
.title h1 em { font-style: italic; color: var(--accent); }
.title p { margin: 0; color: var(--ink-2); font-size: 17px; max-width: 46ch; }
.title .cat { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--rule); }
.title .cat dt { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.title .cat dd { margin: 0; font-family: var(--mono); font-size: 12.5px; }

/* The plate */
.exhibit { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; align-items: start; }
.plate { background: var(--paper); position: relative; padding: 18px 18px 14px; outline: 1px solid var(--rule); outline-offset: -9px; }
.plate .corners { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 6px 10px 0; }
.plate .corners.b { padding: 0 10px 6px; align-items: end; }
.plate .tl { font-family: var(--display); font-style: italic; font-size: 19px; }
.plate .tr { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); text-align: right; align-self: center; }
.plate .bl { font-family: var(--mono); font-size: 11px; color: var(--ink-3); max-width: 46ch; }
.plate .br { font-family: var(--mono); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
.plate .br b { color: var(--accent); font-weight: 500; }
.fig { position: relative; }
#plate { display: block; cursor: default; }
#plate:focus-visible { outline-offset: -4px; }
#plate-svg { width: 100%; height: auto; display: block; }

/* Figure tones */
#plate-svg .f { stroke: var(--line); stroke-width: .55; stroke-linejoin: round; }
#plate-svg .t-top { fill: var(--top); } #plate-svg .t-s3 { fill: var(--s3); } #plate-svg .t-s2 { fill: var(--s2); }
#plate-svg .t-s1 { fill: var(--s1); } #plate-svg .t-s0 { fill: var(--s0); } #plate-svg .t-cyl { fill: var(--cyl); }
#plate-svg .t-face { fill: var(--face); }
#plate-svg .hatch { fill: none; stroke: var(--hatch); stroke-width: .42; opacity: var(--hatch-op); }
#plate-svg .ln { fill: none; stroke-width: .5; stroke-linecap: round; }
#plate-svg .ln.lo, #plate-svg .ln-lo { stroke: var(--lo); } #plate-svg .ln.mid { stroke: var(--line); stroke-width: .6; }
#plate-svg .ln.hi { stroke: var(--line); stroke-width: 1.3; } #plate-svg .ln.faint { stroke: var(--faint); }
#plate-svg .ln.zero { stroke: var(--accent); stroke-width: .9; }
#plate-svg .ln-lo { stroke-width: .4; }
#plate-svg .dot, #plate-svg .hub { fill: var(--line); }
#plate-svg .glint { fill: var(--top); opacity: .9; }
#plate-svg .brass .f { fill: var(--brass); }
#plate-svg .engr { fill: var(--ink); font-family: var(--mono); letter-spacing: .06em; }
#plate-svg .engr.lo { fill: var(--ink-3); } #plate-svg .engr.tok { font-family: var(--body); font-weight: 600; letter-spacing: .02em; }
#plate-svg .glass-back { fill: var(--glass); opacity: .55; stroke: var(--glass-line); stroke-width: .35; }
#plate-svg .glass-front { fill: var(--glass); fill-opacity: .14; stroke: var(--glass-line); stroke-width: .6; }
#plate-svg .glass-rim { fill: none; stroke: var(--glass-line); stroke-width: .6; }
#plate-svg .glass-lip { fill: var(--glass); fill-opacity: .35; stroke: var(--glass-line); stroke-width: .5; }
#plate-svg .ln.grad { stroke: var(--glass-line); stroke-width: .45; }
#plate-svg .ln.glint-line { stroke: var(--top); stroke-width: 1.4; opacity: .8; }
#plate-svg .fluid { fill: var(--fluid); stroke: var(--fluid-deep); stroke-width: .5; }
#plate-svg .fluid-top { fill: var(--fluid-top); stroke: var(--fluid-deep); stroke-width: .5; }
#plate-svg .fluidg .hatch { stroke: var(--fluid-deep); opacity: .55; }
#plate-svg .t-fluid { fill: var(--fluid); } #plate-svg .t-fluid-top { fill: var(--fluid-top); } #plate-svg .t-fluid-2 { fill: var(--fluid-2); } #plate-svg .t-fluid-3 { fill: var(--fluid-3); }
#plate-svg .stratum .f { stroke: var(--fluid-deep); }
#plate-svg .t-shut { fill: var(--shut); }
#plate-svg .shutter .t-cyl { fill: var(--s1); }
#plate-svg .needle { fill: var(--accent); stroke: var(--fluid-deep); stroke-width: .3; }
#plate-svg .pin circle { fill: var(--ink); stroke: var(--paper); stroke-width: 1.4; transition: fill .2s; }
#plate-svg .pin text { fill: var(--paper); font-family: var(--mono); font-size: 8.4px; font-weight: 500; }
#plate-svg .pin.on circle { fill: var(--accent); }
#plate-svg .hit { fill: transparent; cursor: pointer; }
#plate-svg .hit:hover { fill: var(--accent-soft); }
#plate-svg [data-part].lit .f { stroke: var(--accent); stroke-width: 1; }

/* The key */
.key { background: var(--paper); padding: 20px 20px 16px; }
.key h2, .controls h2 { font-family: var(--display); font-weight: 500; font-style: italic; font-size: 22px; margin: 0 0 4px; }
.key ol { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 2px; }
.key li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 7px 4px; border-top: 1px solid var(--rule); cursor: default; border-radius: 2px; }
.key li:hover, .key li.on { background: var(--accent-soft); }
.num { display: inline-grid; place-items: center; width: 19px; height: 19px; border-radius: 50%; background: var(--ink); color: var(--paper); font-family: var(--mono); font-size: 10.5px; font-weight: 500; line-height: 1; }
.key li.on .num { background: var(--accent); }
.key b { font-weight: 600; font-size: 14px; display: block; line-height: 1.3; }
.key span.d { font-size: 13px; color: var(--ink-2); line-height: 1.4; display: block; }
.key code { font-family: var(--mono); font-size: 11.5px; color: var(--ink); }
.controls { margin-top: 18px; background: var(--paper); padding: 20px; display: grid; gap: 16px; }
.ctl .label { display: flex; justify-content: space-between; margin-bottom: 7px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--rule); }
.seg.tok { grid-template-columns: repeat(4, 1fr); }
.seg button { font: 500 12px/1 var(--mono); padding: 9px 2px; background: none; border: 0; border-left: 1px solid var(--rule); color: var(--ink-2); cursor: pointer; }
.seg.tok button:nth-child(4n+1) { border-left: 0; } .seg.tok button:nth-child(n+5) { border-top: 1px solid var(--rule); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.seg button:hover:not([aria-pressed="true"]) { background: var(--accent-soft); color: var(--ink); }
.headname { font-size: 13px; color: var(--ink-2); margin-top: 7px; min-height: 2.8em; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13.5px; }
.toggle button { font: 500 12px/1 var(--mono); padding: 8px 12px; border: 1px solid var(--rule); background: none; color: var(--ink); cursor: pointer; min-width: 92px; }
.toggle button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

/* Wall texts */
section.wall { margin-top: 84px; }
.sechead { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px 40px; padding-top: 14px; border-top: 1px solid var(--ink); margin-bottom: 30px; }
.sechead .label { padding-top: 10px; }
.sechead h2 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 4vw, 46px); line-height: 1.05; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.sechead p { grid-column: 2; margin: 0; color: var(--ink-2); max-width: 64ch; }
.stages { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border-left: 1px solid var(--rule); }
.stage { padding: 4px 22px 8px; border-right: 1px solid var(--rule); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.stage .rn { font-family: var(--display); font-style: italic; font-size: 34px; line-height: 1; color: var(--accent); }
.stage h3 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .01em; }
.stage .eq { font-family: var(--display); font-size: 21px; padding: 10px 0; border-block: 1px solid var(--rule); white-space: nowrap; overflow-x: auto; }
.stage .eq i { font-style: italic; }
.stage p { margin: 0; font-size: 14.5px; color: var(--ink-2); }
.stage .live { font-family: var(--mono); font-size: 12px; color: var(--ink); background: var(--paper); padding: 10px 12px; font-variant-numeric: tabular-nums; line-height: 1.6; }
.stage .live b { color: var(--accent); font-weight: 500; }
.inl { display: inline-grid; width: 16px; height: 16px; font-size: 9.5px; vertical-align: 1px; }

/* Ledger */
.ledger-wrap { overflow-x: auto; background: var(--paper); padding: 8px 20px 18px; }
.qline { font-family: var(--mono); font-size: 12px; padding: 12px 0 14px; border-bottom: 1px solid var(--rule); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--ink-2); }
table.ledger { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; min-width: 760px; }
.ledger th { font-weight: 500; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); text-align: right; padding: 12px 10px 8px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
.ledger th:nth-child(-n+3), .ledger td:nth-child(-n+3) { text-align: left; }
.ledger td { padding: 7px 10px; border-bottom: 1px solid var(--rule); text-align: right; white-space: nowrap; }
.ledger td.tok { font-family: var(--body); font-weight: 600; font-size: 14px; }
.ledger tr.q td { background: var(--accent-soft); }
.ledger tr.mask td { color: var(--ink-3); }
.ledger tr.mask td.w { background-image: repeating-linear-gradient(135deg, transparent 0 4px, var(--rule) 4px 5px); }
.ledger tr { cursor: pointer; }
.strip { display: inline-grid; grid-template-columns: repeat(8, 11px); gap: 2px; vertical-align: middle; }
.strip i { height: 11px; border: 1px solid var(--rule); display: block; }
.bar { display: grid; grid-template-columns: 1fr 50px; gap: 10px; align-items: center; min-width: 170px; }
.bar span { height: 7px; background: var(--rule); position: relative; display: block; }
.bar span i { position: absolute; inset: 0 auto 0 0; background: var(--accent); display: block; }

/* Matrix */
.matrix-wrap { display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr); gap: 32px 48px; align-items: start; }
.matrix { display: grid; grid-template-columns: 74px repeat(8, 44px); gap: 3px; font-family: var(--mono); font-size: 11px; overflow-x: auto; background: var(--paper); padding: 18px; }
.matrix .ch { writing-mode: vertical-rl; transform: rotate(180deg); text-align: left; color: var(--ink-3); padding-top: 4px; height: 64px; font-family: var(--body); font-weight: 600; font-size: 12px; }
.matrix .rh { text-align: right; padding-right: 8px; align-self: center; font-family: var(--body); font-weight: 600; font-size: 12.5px; cursor: pointer; }
.matrix button { height: 44px; border: 1px solid var(--rule); background: var(--paper); position: relative; padding: 0; font: 500 10px/1 var(--mono); color: var(--ink); cursor: pointer; font-variant-numeric: tabular-nums; }
.matrix button .fill { position: absolute; inset: 0; background: var(--accent); }
.matrix button span { position: relative; }
.matrix button.dark { color: #fff; }
.matrix button.mask { background-image: repeating-linear-gradient(135deg, transparent 0 4px, var(--rule) 4px 5px); color: transparent; }
.matrix button.row { outline: 1.5px solid var(--ink); outline-offset: 0; z-index: 1; }
.matrix-notes p { margin: 0 0 14px; color: var(--ink-2); max-width: 52ch; }
.matrix-notes h3 { font-family: var(--display); font-style: italic; font-weight: 500; font-size: 24px; margin: 0 0 10px; }
.heads { display: grid; gap: 0; margin-top: 18px; border-top: 1px solid var(--rule); }
.heads button { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; text-align: left; padding: 11px 6px; border: 0; border-bottom: 1px solid var(--rule); background: none; color: var(--ink); cursor: pointer; font: inherit; align-items: baseline; }
.heads button .rn { font-family: var(--display); font-style: italic; font-size: 19px; color: var(--ink-3); }
.heads button b { font-weight: 600; font-size: 14.5px; } .heads button small { display: block; color: var(--ink-2); font-size: 13px; }
.heads button .h { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }
.heads button[aria-pressed="true"] { background: var(--paper); } .heads button[aria-pressed="true"] .rn { color: var(--accent); }

/* Notes and colophon */
.notes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 40px; }
.notes div { border-top: 1px solid var(--rule); padding-top: 14px; }
.notes h3 { font-size: 14.5px; font-weight: 600; margin: 0 0 6px; }
.notes p { margin: 0; color: var(--ink-2); font-size: 14.5px; }
footer { margin-top: 84px; padding-top: 16px; border-top: 1px solid var(--rule); display: grid; grid-template-columns: 1fr auto; gap: 16px; font-size: 13px; color: var(--ink-3); }
footer .mark { font-family: var(--display); letter-spacing: .32em; text-transform: uppercase; color: var(--ink); }

@media (max-width: 1080px) {
  .exhibit { grid-template-columns: minmax(0, 1fr); }
  .side { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  .controls { margin-top: 0; }
  .stages { grid-template-columns: repeat(2, minmax(0, 1fr)); border-left: 0; }
  .stage { border-right: 0; border-top: 1px solid var(--rule); padding: 18px 18px 22px 0; }
  .matrix-wrap { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 720px) {
  .mast { grid-template-columns: 1fr auto; } .mast .c { display: none; }
  .title { grid-template-columns: minmax(0, 1fr); padding-block: 32px 24px; }
  .side { grid-template-columns: minmax(0, 1fr); }
  .plate { padding: 10px 6px 8px; outline-offset: -5px; }
  .plate .bl { display: none; } .plate .corners.b { grid-template-columns: 1fr; }
  .stages { grid-template-columns: minmax(0, 1fr); }
  .sechead { grid-template-columns: minmax(0, 1fr); gap: 8px; } .sechead p { grid-column: 1; } .sechead .label { padding-top: 0; }
  .notes { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .matrix { grid-template-columns: 56px repeat(8, minmax(26px, 1fr)); padding: 10px; gap: 2px; }
  .matrix button { height: 32px; font-size: 0; }
  footer { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Site navigation */
.mast a { color: inherit; text-decoration: none; }
.mast a:hover { color: var(--accent); }
.mast .mark a { letter-spacing: inherit; }
.platenav { margin-top: 84px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; border-top: 1px solid var(--ink); padding-top: 16px; }
.platenav a { text-decoration: none; display: grid; gap: 4px; padding: 14px 0; }
.platenav a:last-child { text-align: right; }
.platenav b { font-family: var(--display); font-weight: 400; font-size: clamp(22px, 3vw, 32px); line-height: 1.1; }
.platenav a:hover b { color: var(--accent); }

/* Blood: arterial uses the accent, venous its own indigo. Colour is the subject here. */
#plate-svg .arterial { fill: var(--fluid); stroke: var(--fluid-deep); stroke-width: .5; }
#plate-svg .arterial-top, #plate-svg .arterial-cap { fill: var(--fluid-top); stroke: var(--fluid-deep); stroke-width: .5; }
#plate-svg .venous { fill: var(--venous); stroke: var(--venous-deep); stroke-width: .5; }
#plate-svg .venous-top, #plate-svg .venous-cap { fill: var(--venous-top); stroke: var(--venous-deep); stroke-width: .5; }

<script>
/* Folio kit: an orthographic isometric camera and engraved solids, drawn as SVG strings.
   World units: x along the bench, y toward the viewer, z up. No dependencies. */
(function (root) {
  "use strict";
  const D = Math.PI / 180;
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const len = (a) => Math.hypot(a[0], a[1], a[2]);
  const norm = (a) => mul(a, 1 / (len(a) || 1));
  const f = (n) => (Math.round(n * 100) / 100).toString();

  /* The light comes from the upper left, slightly in front. Tones are chosen by facing. */
  const LIGHT = norm([-0.55, 0.35, 0.78]);

  function camera(o = {}) {
    const az = o.az ?? -24, el = o.el ?? 30, k = o.k ?? 1, ox = o.ox ?? 0, oy = o.oy ?? 0;
    const a = az * D, e = el * D;
    const ca = Math.cos(a), sa = Math.sin(a), ce = Math.cos(e), se = Math.sin(e);
    return {
      az, el, k, ox, oy,
      view: [-sa * ce, ca * ce, se],
      p(x, y, z) {
        if (Array.isArray(x)) [x, y, z] = x;
        const u = x * ca + y * sa, w = -x * sa + y * ca;
        return [ox + k * u, oy + k * (w * se - z * ce)];
      },
      depth(x, y, z) {
        if (Array.isArray(x)) [x, y, z] = x;
        return -x * sa * ce + y * ca * ce + z * se;
      },
    };
  }

  /* Fit a camera so that the given world points fill W x H with padding. */
  function fit(o, pts, W, H, pad = 24) {
    const c = camera({ ...o, k: 1, ox: 0, oy: 0 });
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of pts) {
      const [x, y] = c.p(p);
      x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
    }
    const k = Math.min((W - 2 * pad) / (x1 - x0), (H - 2 * pad) / (y1 - y0), o.maxK ?? Infinity);
    return camera({ ...o, k, ox: W / 2 - k * (x0 + x1) / 2, oy: H / 2 - k * (y0 + y1) / 2 });
  }

  const path = (pts, close = true) =>
    "M" + pts.map((q) => f(q[0]) + " " + f(q[1])).join("L") + (close ? "Z" : "");

  function toneOf(n) {
    if (n[2] > 0.9) return "top";
    if (n[2] < -0.9) return "s0";
    const d = dot(n, LIGHT);
    return d < -0.25 ? "s0" : d < 0 ? "s1" : d < 0.25 ? "s2" : "s3";
  }

  const attrs = (o) => {
    let s = "";
    if (o.id) s += ` id="${o.id}"`;
    if (o.part) s += ` data-part="${o.part}"`;
    return s;
  };

  /* A box from (x,y,z) with size (w,d,h). Draws only the faces turned to the viewer,
     shaded by facing, with an optional engraved hatch on the darkest side and an inset
     groove on the top. */
  function box(cam, x, y, z, w, d, h, o = {}) {
    const P = (a, b, c) => cam.p(a, b, c);
    const X = x + w, Y = y + d, Z = z + h;
    const faces = [
      { n: [0, 0, 1], q: [[x, y, Z], [X, y, Z], [X, Y, Z], [x, Y, Z]] },
      { n: [0, 1, 0], q: [[x, Y, z], [X, Y, z], [X, Y, Z], [x, Y, Z]] },
      { n: [0, -1, 0], q: [[x, y, z], [X, y, z], [X, y, Z], [x, y, Z]] },
      { n: [1, 0, 0], q: [[X, y, z], [X, Y, z], [X, Y, Z], [X, y, Z]] },
      { n: [-1, 0, 0], q: [[x, y, z], [x, Y, z], [x, Y, Z], [x, y, Z]] },
    ];
    let s = `<g class="sol ${o.cls || ""}"${attrs(o)}>`;
    let darkest = null;
    for (const fc of faces) {
      if (dot(fc.n, cam.view) <= 1e-6) continue;
      const t = o.tone && fc.n[2] < 0.9 ? o.tone : toneOf(fc.n);
      s += `<path class="f t-${fc.n[2] > 0.9 ? (o.topTone || "top") : t}" d="${path(fc.q.map((v) => P(...v)))}"/>`;
      if (fc.n[2] < 0.9 && (!darkest || dot(fc.n, LIGHT) < dot(darkest.n, LIGHT))) darkest = fc;
    }
    if (o.hatch && darkest && h > 2) {
      const sp = o.hatch === true ? 3 : o.hatch;
      const n = darkest.n, along = n[0] !== 0 ? [0, 1, 0] : [1, 0, 0];
      const L = n[0] !== 0 ? d : w, base = darkest.q[0];
      let lines = "";
      for (let t = sp; t < L - sp * 0.5; t += sp) {
        const a = add(base, mul(along, t));
        lines += `M${f(P(...a)[0])} ${f(P(...a)[1])}L${f(P(a[0], a[1], Z)[0])} ${f(P(a[0], a[1], Z)[1])}`;
      }
      s += `<path class="hatch" d="${lines}"/>`;
    }
    if (o.groove) {
      const g = o.groove;
      s += `<path class="ln faint" d="${path([[x + g, y + g, Z], [X - g, y + g, Z], [X - g, Y - g, Z], [x + g, Y - g, Z]].map((v) => P(...v)))}"/>`;
    }
    return s + "</g>";
  }

  function basis(axis) {
    const n = norm(axis);
    const t = Math.abs(n[2]) < 0.9 ? [0, 0, 1] : [1, 0, 0];
    const u = norm(cross(n, t));
    const v = cross(n, u);
    return [n, u, v];
  }
  const ringPt = (c, u, v, r, t) => add(c, add(mul(u, r * Math.cos(t)), mul(v, r * Math.sin(t))));

  /* A round bar from p0 to p1 of radius r: a post, a rail, a pipe, a knob or a drum.
     The side is engraved with hatch lines whose density follows the shade, so a
     curved body reads as turned metal instead of a staircase of flat tones. */
  function rod(cam, p0, p1, r, o = {}) {
    const N = o.seg || 44;
    const [n, u, v] = basis(sub(p1, p0));
    const V = cam.view;
    const phi = Math.atan2(dot(v, V), dot(u, V));
    const t0 = phi - Math.PI / 2, t1 = phi + Math.PI / 2;
    const side = [];
    for (let i = 0; i <= N; i++) side.push(cam.p(ringPt(p0, u, v, r, t0 + (t1 - t0) * i / N)));
    for (let i = N; i >= 0; i--) side.push(cam.p(ringPt(p1, u, v, r, t0 + (t1 - t0) * i / N)));
    const capC = dot(n, V) > 0 ? p1 : p0;
    const cap = [];
    for (let i = 0; i < N * 2; i++) cap.push(cam.p(ringPt(capC, u, v, r, (i / (N * 2)) * Math.PI * 2)));
    let s = `<g class="sol ${o.cls || ""}"${attrs(o)}>`;
    s += `<path class="f ${o.sideCls || "t-cyl"}" d="${path(side)}"/>`;
    if (o.hatch !== false) {
      const K = 90; let acc = 0, lines = "";
      const dens = o.density ?? 1;
      for (let i = 1; i < K; i++) {
        const t = t0 + (t1 - t0) * i / K;
        const m = add(mul(u, Math.cos(t)), mul(v, Math.sin(t)));
        const dark = Math.pow(Math.max(0, 1 - (dot(m, LIGHT) + 1) / 1.6), 1.7);
        acc += dark * dens * (r * cam.k) / 14;
        if (acc >= 1) {
          acc -= 1;
          const a = cam.p(ringPt(p0, u, v, r, t)), b = cam.p(ringPt(p1, u, v, r, t));
          lines += `M${f(a[0])} ${f(a[1])}L${f(b[0])} ${f(b[1])}`;
        }
      }
      if (lines) s += `<path class="hatch" d="${lines}"/>`;
    }
    if (o.knurl) {
      let lines = "";
      for (let i = 0; i < o.knurl; i++) {
        const t = t0 + (t1 - t0) * (i + 0.5) / o.knurl;
        const a = cam.p(ringPt(p0, u, v, r, t)), b = cam.p(ringPt(p1, u, v, r, t));
        lines += `M${f(a[0])} ${f(a[1])}L${f(b[0])} ${f(b[1])}`;
      }
      s += `<path class="ln lo" d="${lines}"/>`;
    }
    if (o.cap !== false) s += `<path class="f ${o.capCls || "t-top"}" d="${path(cap)}"/>`;
    return s + "</g>";
  }

  /* A vertical drum standing on the floor plane. */
  const drum = (cam, cx, cy, z, r, h, o) => rod(cam, [cx, cy, z], [cx, cy, z + h], r, o);

  /* A ball: in an orthographic camera it projects to a circle. */
  function ball(cam, c, r, o = {}) {
    const [x, y] = cam.p(c);
    const R = r * cam.k;
    const hx = x - R * 0.35, hy = y - R * 0.4;
    return `<g class="sol ${o.cls || ""}"${attrs(o)}><circle class="f t-cyl" cx="${f(x)}" cy="${f(y)}" r="${f(R)}"/>` +
      `<path class="hatch" d="M${f(x + R * 0.15)} ${f(y + R * 0.92)}A${f(R)} ${f(R)} 0 0 0 ${f(x + R * 0.92)} ${f(y + R * 0.2)}"/>` +
      `<circle class="glint" cx="${f(hx)}" cy="${f(hy)}" r="${f(R * 0.18)}"/></g>`;
  }

  /* A circle lying on a horizontal plane, as a closed path. */
  function ringPath(cam, cx, cy, z, r, N = 48) {
    const pts = [];
    for (let i = 0; i < N; i++) { const t = (i / N) * Math.PI * 2; pts.push(cam.p(cx + r * Math.cos(t), cy + r * Math.sin(t), z)); }
    return path(pts);

  /* An arc on a horizontal plane, angles in degrees measured in world xy. */
  function arcPath(cam, cx, cy, z, r, a0, a1, N = 32) {
    const pts = [];
    for (let i = 0; i <= N; i++) { const t = (a0 + (a1 - a0) * i / N) * D; pts.push(cam.p(cx + r * Math.cos(t), cy + r * Math.sin(t), z)); }

  /* Radial ticks on a horizontal plane. */
  function radialTicks(cam, cx, cy, z, r0, r1, angles) {
    let s = "";

      const t = a * D;
      const p = cam.p(cx + r0 * Math.cos(t), cy + r0 * Math.sin(t), z);
      const q = cam.p(cx + r1 * Math.cos(t), cy + r1 * Math.sin(t), z);
      s += `M${f(p[0])} ${f(p[1])}L${f(q[0])} ${f(q[1])}`;
    }
    return s;

  function line(cam, a, b) {
    const p = cam.p(a), q = cam.p(b);

     direction of "down" on the glyphs. Size is in world units. */

<script>
/* The true model behind Plate II: a lumped-parameter model of the human circulation.
   Four heart chambers are time-varying elastances, P = E(t)(V - V0). The pulmonary and
   systemic circuits are compliances joined by resistances. Valves are diodes; a damaged
   valve becomes a narrow orifice (stenosis) or leaks backwards (regurgitation).
   Units: volume mL, pressure mmHg, flow mL/s, time s. */
(function (root) {
  "use strict";
  const CH = ["RA", "RV", "PA", "PV", "LA", "LV", "SA", "SV"];
  const NAME = {
    RA: "Right atrium", RV: "Right ventricle", PA: "Pulmonary arteries", PV: "Pulmonary veins",
    LA: "Left atrium", LV: "Left ventricle", SA: "Systemic arteries", SV: "Systemic veins",
  };
  const P0 = {
    // chambers: Emax, Emin (mmHg/mL), V0 (mL)
    RA: { Emax: 0.25, Emin: 0.12, V0: 4 },
    RV: { Emax: 0.55, Emin: 0.05, V0: 10 },
    LA: { Emax: 0.30, Emin: 0.15, V0: 4 },
    LV: { Emax: 2.5, Emin: 0.07, V0: 8 },
    // vessels: compliance C (mL/mmHg), V0 (mL, unstressed)
    PA: { C: 4.0, V0: 120 }, PV: { C: 18, V0: 180 }, SA: { C: 1.6, V0: 700 }, SV: { C: 65, V0: 2600 },
    // resistances, mmHg·s/mL
    R: { tri: 0.004, pulv: 0.004, pul: 0.08, pv: 0.012, mit: 0.004, aov: 0.005, sys: 1.1, sv: 0.03 },
  };
  const FAULTS = {
    normal: { id: "normal", name: "Healthy", note: "every valve opens wide and seals" },
    as: { id: "as", name: "Aortic stenosis", note: "a narrowed aortic valve the ventricle must force blood through" },
    mr: { id: "mr", name: "Mitral regurgitation", note: "a leaking mitral valve; some blood flows back each beat" },
  };

  function make(opts = {}) {
    const s = {
      HR: opts.HR ?? 72, contract: opts.contract ?? 1, fault: opts.fault ?? "normal",
      t: 0, tc: 0, V: { RA: 50, RV: 120, PA: 190, PV: 330, LA: 60, LV: 120, SA: 820, SV: 3070 },
      P: {}, Q: {}, phase: "", valves: {},
    };
    s.total = Object.values(s.V).reduce((a, b) => a + b, 0);
    return s;
  }

  /* Ventricular and atrial activation, 0..1, from the time since the last ventricular onset. */
  function activation(tc, T) {
    const Ts1 = 0.42 * Math.sqrt(T), Ts2 = 0.2 * Ts1;
    let v = 0;
    if (tc < Ts1) v = 0.5 * (1 - Math.cos((Math.PI * tc) / Ts1));
    else if (tc < Ts1 + Ts2) v = 0.5 * (1 + Math.cos((Math.PI * (tc - Ts1)) / Ts2));
    const Ta = Math.min(0.2, 0.25 * T), ta0 = T - Ta - 0.02;
    let a = 0;
    if (tc > ta0 && tc < ta0 + Ta) a = 0.5 * (1 - Math.cos((2 * Math.PI * (tc - ta0)) / Ta));
    return { v, a, Ts1, Ts2 };
  }

  function pressures(s) {
    const T = 60 / s.HR, act = activation(s.tc, T), P = {};
    for (const c of ["RA", "LA"]) { const p = P0[c]; P[c] = (p.Emin + (p.Emax - p.Emin) * act.a) * (s.V[c] - p.V0); }
    for (const c of ["RV", "LV"]) {
      const p = P0[c], Emax = c === "LV" ? p.Emax * s.contract : p.Emax * (0.6 + 0.4 * s.contract);
      P[c] = (p.Emin + (Emax - p.Emin) * act.v) * (s.V[c] - p.V0);
    }
    for (const c of ["PA", "PV", "SA", "SV"]) P[c] = (s.V[c] - P0[c].V0) / P0[c].C;
    return { P, act };
  }

  function flows(s, P) {
    const R = P0.R, f = s.fault, d = (a, b, r) => Math.max(0, (a - b) / r);
    const Q = {
      sv: (P.SV - P.RA) / R.sv,
      tri: d(P.RA, P.RV, R.tri),
      pulv: d(P.RV, P.PA, R.pulv),
      pul: (P.PA - P.PV) / R.pul,
      pv: (P.PV - P.LA) / R.pv,
      mit: d(P.LA, P.LV, R.mit),
      aov: d(P.LV, P.SA, f === "as" ? 0.16 : R.aov),
      sys: (P.SA - P.SV) / R.sys,
    };
    if (f === "mr" && P.LV > P.LA) Q.mit = -(P.LV - P.LA) / 0.32;
    return Q;
  }

  function step(s, dt) {
    const T = 60 / s.HR;
    const { P } = pressures(s);
    const Q = flows(s, P);
    s.V.SV += (Q.sys - Q.sv) * dt;
    s.V.RA += (Q.sv - Q.tri) * dt;
    s.V.RV += (Q.tri - Q.pulv) * dt;
    s.V.PA += (Q.pulv - Q.pul) * dt;
    s.V.PV += (Q.pul - Q.pv) * dt;
    s.V.LA += (Q.pv - Q.mit) * dt;
    s.V.LV += (Q.mit - Q.aov) * dt;
    s.V.SA += (Q.aov - Q.sys) * dt;
    s.t += dt; s.tc += dt;
    let beat = false;
    if (s.tc >= T) { s.tc -= T; beat = true; }
    return beat;
  }

  /* Read everything the plate shows at the current instant. */
  function read(s) {
    const T = 60 / s.HR, { P, act } = pressures(s), Q = flows(s, P);
    const lvSys = s.tc < act.Ts1 + act.Ts2;
    let phase;
    if (Q.aov > 0.5) phase = "ejection";
    else if (Q.mit > 0.5) phase = act.a > 0.05 ? "atrial kick" : "filling";
    else if (s.tc < act.Ts1) phase = "isovolumic contraction";
    else if (P.LV > P.LA && s.tc < act.Ts1 + act.Ts2 + 0.12) phase = "isovolumic relaxation";
    else phase = "filling";
    const valves = {
      tri: Q.tri > 0.5 ? 1 : 0, pulv: Q.pulv > 0.5 ? 1 : 0,
      mit: Q.mit > 0.5 ? 1 : Q.mit < -0.5 ? -1 : 0, aov: Q.aov > 0.5 ? 1 : 0,
    };
    return { P, Q, V: { ...s.V }, act, phase, valves, T, tc: s.tc, lvSys };
  }

  /* Run to a steady beat, then record one full cycle at fine resolution. */
  function settle(s, beats = 14, dt = 0.0005) {
    let n = 0;
    while (n < beats) if (step(s, dt)) n++;
    const T = 60 / s.HR, rec = [];
    let k = 0;
    const N = Math.round(T / dt);
    for (let i = 0; i < N; i++) { if (i % 8 === 0) rec.push({ t: s.tc, ...read(s) }); step(s, dt); k++; }
    return summarise(rec, T);
  }

  function summarise(rec, T) {
    const mx = (f) => Math.max(...rec.map(f)), mn = (f) => Math.min(...rec.map(f));
    const EDV = mx((r) => r.V.LV), ESV = mn((r) => r.V.LV);
    let fwd = 0, back = 0;
    for (let i = 1; i < rec.length; i++) {
      const dt = rec[i].t - rec[i - 1].t > 0 ? rec[i].t - rec[i - 1].t : 0;
      fwd += Math.max(0, rec[i].Q.aov) * dt;
      back += Math.max(0, -rec[i].Q.mit) * dt;
    }
    const SV = fwd;
    return {
      rec, T,
      LV: [mn((r) => r.P.LV), mx((r) => r.P.LV)], SA: [mn((r) => r.P.SA), mx((r) => r.P.SA)],
      RV: [mn((r) => r.P.RV), mx((r) => r.P.RV)], PA: [mn((r) => r.P.PA), mx((r) => r.P.PA)],
      LA: [mn((r) => r.P.LA), mx((r) => r.P.LA)], RA: [mn((r) => r.P.RA), mx((r) => r.P.RA)],
      EDV, ESV, SV, EF: (EDV - ESV) / EDV, CO: (SV * 60) / T / 1000, regurg: back,
      MAP: rec.reduce((a, r) => a + r.P.SA, 0) / rec.length,
    };
  }

  root.HeartModel = { CH, NAME, P0, FAULTS, make, step, read, settle, activation };
})(typeof window !== "undefined" ? window : globalThis);

  const hintEl = document.querySelector(".plate .bl"), hint0 = hintEl ? hintEl.textContent : "";
  const CHAMBERS = [
    { c: VR, kind: 0, level: (r) => (r.V.SV - H.P0.SV.V0) / 620, piston: false },
    { c: RA, kind: 0, level: (r) => r.V.RA / RA.vmax, piston: true, act: "a" },
    { c: RV, kind: 0, level: (r) => r.V.RV / RV.vmax, piston: true, act: "v" },
    { c: LV, kind: 1, level: (r) => r.V.LV / LV.vmax, piston: true, act: "v" },
    { c: LA, kind: 1, level: (r) => r.V.LA / LA.vmax, piston: true, act: "a" },
    { c: AC, kind: 1, level: (r) => 0.12 + (Math.max(0, r.P.SA) / 160) * 0.8, piston: false },
  ];
  function lightFrame(now) {
    lightRaf = 0;
    if (mode !== "webgl" || !lightLayer) return;
    if (!visible) { lightRaf = requestAnimationFrame(lightFrame); return; }
    if (lightLayer.size()) lightLayer.mask();
    const A = [], B = [], Sh = [];
    for (let i = 0; i < NSEG; i++) {
      const g = segScreen[i];
      if (!g) { A.push(0, 0, 0, 0); B.push(0, 0, 0, 0); Sh.push(0); continue; }
      A.push(g.a[0], g.a[1], g.b[0], g.b[1]); B.push(g.start, g.len, g.kind, g.r);
      Sh.push((keyOff[g.key] || 0) * 0.06 * (g.rev ? -1 : 1));
    }
    const ch = [], chS = [], chE = [];
    const act = cur.act || { v: 0, a: 0 };
    for (const k of CHAMBERS) {
      const c = k.c, lv = Math.max(0, Math.min(1, k.level(cur)));
      const top = c.z + c.h, zF = k.piston ? top - lv * c.h : c.z + lv * c.h;
      ch.push(c.x, c.y, (k.piston ? top : zF) + 0.0001, k.kind);
      const b = cam.p(c.x, c.y, c.z), t = cam.p(c.x, c.y, top), f = cam.p(c.x, c.y, zF);
      chS.push(b[0], t[1], k.piston ? f[1] : -f[1], c.r * cam.k);
      chE.push(Math.min(1, 0.35 + 0.65 * lv + (k.act ? act[k.act] * 0.6 : 0)));
    }
    lightLayer.set("uSegA", A); lightLayer.set("uSegB", B);
    lightLayer.set("uSegShift", new Float32Array(Sh));
    lightLayer.set("uNSeg", Math.min(NSEG, segScreen.length));
    lightLayer.set("uCh", ch); lightLayer.set("uChS", chS);
    lightLayer.set("uChE", new Float32Array(chE));
    lightLayer.draw(cam, reduce.matches ? 2 : now / 1000, K.live.isDark());
    if (!reduce.matches) lightRaf = requestAnimationFrame(lightFrame);
  }
  const MASK_CSS = `.floor .t-top { fill: #f00 !important; }
    .arterial, .venous, .arterial-ball .f, .venous-ball .f, .arterial-cap, .venous-cap { fill: #0f0 !important; stroke: #0f0 !important; }
    .glass-back, .glass-front { fill: #00f !important; stroke: #00f !important; }`;
  function setMode(m) {
    mode = m;
    if (m === "3d" && typeof insp !== "undefined") insp.close();
    fig.classList.toggle("mode-webgl", m === "webgl");
    fig.classList.toggle("mode-3d", m === "3d");
    if (m !== "3d" && (stage.az !== -24 || stage.el !== 30)) { mount(-24, 30); paint(); }
    if (m === "webgl") {
      try { lightLayer = lightLayer || K.live.light({ canvas, svg, W, H: HT, frag: LIGHT_FRAG, maskCss: MASK_CSS }); } catch (e) { lightLayer = null; console.warn(e); }
      if (lightLayer) { lightLayer.size(); lightLayer.mask().then(() => { if (!lightRaf) lightRaf = requestAnimationFrame(lightFrame); }); }
    }
    if (hintEl) hintEl.textContent = m === "3d" ? "Drag to turn the bench · double-click to reset · Shift + arrows to turn" : hint0;
    views.set(m);
  }
  const views = K.live.views(document.getElementById("views"), {
    modes: [{ id: "svg", label: "SVG" }, { id: "webgl", label: "WebGL", ok: K.live.webglOK() }, { id: "3d", label: "3D" }],
    current: "svg", onSelect: setMode,
  });
  let turnPending = null;
  const orb = K.live.orbit(fig, {
    az0: -24, el0: 30, wrap: true, azRange: [-180, 180], elRange: [8, 76], enabled: () => mode === "3d",
    onTurn(az, el) {
      if (turnPending) { turnPending = [az, el]; return; }
      turnPending = [az, el];
      requestAnimationFrame(() => { const [a, e] = turnPending; turnPending = null; mount(a, e); paint(); dashes(); });
    },
  });
  fig.addEventListener("keydown", (e) => {
    if (mode !== "3d" || !e.shiftKey) return;
    const d = { ArrowLeft: [-6, 0], ArrowRight: [6, 0], ArrowUp: [0, -4], ArrowDown: [0, 4] }[e.key];
    if (d) { orb.nudge(...d); e.stopImmediatePropagation(); e.preventDefault(); }
  }, true);
  new ResizeObserver(() => { if (mode === "webgl" && lightLayer && lightLayer.size()) lightLayer.mask(); }).observe(fig);
  Object.assign(window.Plate, {
    view: (m) => setMode(m),
    turn: (az, el) => { setMode("3d"); mount(az, el); paint(); dashes(); },
    light: () => lightLayer,
  });

  /* ---------- looking closer ---------- */
  const r0 = (v) => Math.round(v);
  const vstate = (v) => (v === 1 ? "<b>open</b>" : v === -1 ? "<b>leaking back</b>" : "shut");
  const PART_TEXT = [
    [1, "Venous reservoir", "The great veins. Blood comes home from the body here, low in pressure and low in oxygen."],
    [2, "Right atrium", "A small primer pump. It fills while the ventricle squeezes, then tops the ventricle up with a short kick."],
    [3, "Tricuspid valve", "Lets blood fall into the right ventricle and seals when the ventricle squeezes."],
    [4, "Right ventricle", "The pump for the lungs. It needs only about 25 mmHg; the lung circuit is short and soft."],
    [5, "Pulmonary valve", "Opens while the right ventricle ejects, then seals the pulmonary artery."],
    [6, "Lungs", "Bellows breathing 14 times a minute. Blood goes in dark and leaves bright with oxygen."],
    [7, "Left atrium", "Collects oxygenated blood from the pulmonary veins and primes the left ventricle."],
    [8, "Mitral valve", "The left inflow valve. Set the valves to Leak and it lets blood back into the atrium."],
    [9, "Left ventricle", "The pump for the whole body. It reaches about 115 mmHg and moves about 70 mL a beat."],
    [10, "Aortic valve", "Opens once the ventricle out-pushes the aorta. Set the valves to Stenosis and it narrows."],
    [11, "Air chamber", "The elastic aorta. A cushion of air stores each surge and keeps pressure up between beats."],
    [12, "Capillary bed", "The body. Seventeen fine tubes where blood gives up its oxygen and turns dark again."],
  ];
  const PARTS = PART_TEXT.map(([n, name, text]) => ({ n, name, text, at: PINS.find((p) => p[0] === n)[1] }));
  const liveH = (n) => {
    const r = cur, b = lastBeat;
    switch (n) {
      case 1: return `pressure <b>${r.P.SV.toFixed(1)}</b> mmHg · holds ${r0(r.V.SV)} mL`;
      case 2: return `pressure <b>${r.P.RA.toFixed(1)}</b> mmHg · volume ${r0(r.V.RA)} mL`;
      case 3: return `${vstate(r.valves.tri)} · flow ${r0(Math.max(0, r.Q.tri))} mL/s`;
      case 4: return `pressure <b>${r0(r.P.RV)}</b> mmHg · volume ${r0(r.V.RV)} mL · ${r.phase}`;
      case 5: return `${vstate(r.valves.pulv)} · flow ${r0(Math.max(0, r.Q.pulv))} mL/s`;
      case 6: return `artery <b>${r0(r.P.PA)}</b> mmHg → veins ${r0(r.P.PV)} mmHg · ${r0(r.Q.pul)} mL/s`;
      case 7: return `pressure <b>${r.P.LA.toFixed(1)}</b> mmHg · volume ${r0(r.V.LA)} mL`;
      case 8: return `${vstate(r.valves.mit)} · flow ${r0(r.Q.mit)} mL/s` + (b && b.regurg > 1 ? ` · leaks ${r0(b.regurg)} mL a beat` : "");
      case 9: return `pressure <b>${r0(r.P.LV)}</b> mmHg · volume ${r0(r.V.LV)} mL · ${r.phase}`;
      case 10: return `${vstate(r.valves.aov)} · flow ${r0(Math.max(0, r.Q.aov))} mL/s` + (b ? ` · LV peak ${r0(b.LV[1])} mmHg` : "");
      case 11: return `pressure <b>${r0(r.P.SA)}</b> mmHg` + (b ? ` · ${r0(b.SA[1])}/${r0(b.SA[0])} last beat` : "");
      case 12: return `flow <b>${r0(r.Q.sys)}</b> mL/s` + (b ? ` · ${b.CO.toFixed(1)} L/min` : "");
    }
    return "";
  };
  const insp = K.live.inspector({ fig, svg, W, H: HT, parts: PARTS, cam: () => cam, live: liveH, zoom: 2.3,
    onChange: (n) => { if (n !== null && lens.on) toggleLens(false); } });
  const lens = K.live.loupe({ fig, svg, W, H: HT, sceneId: stage.sceneId, mag: 2.6, r: 88 });
  const toolsEl = document.getElementById("tools");
  function toggleLens(v) {
    lens.toggle(v); if (lens.on) insp.close();
    toolsEl?.querySelector('[data-t="loupe"]')?.setAttribute("aria-pressed", lens.on);
  }
  toolsEl?.addEventListener("click", (e) => { if (e.target.closest('[data-t="loupe"]')) toggleLens(); });
  setInterval(() => insp.refresh(), 220);
  document.addEventListener("folio:part", (e) => insp.show(e.detail));
  Object.assign(window.Plate, { inspect: (n) => insp.show(n), closeInspect: () => insp.close(), loupe: (v) => toggleLens(v) });

  if (reduce.matches) { ui.playing = false; stillAt(0.18); }
  else { const r0 = H.settle(H.make(ui), 10); lastBeat = { ...r0, HR: ui.HR }; paint(); raf = requestAnimationFrame(frame); }
})();

</script>
<script>
Plate.on((ui, cur, b) => { document.getElementById("readout").innerHTML = ui.HR + " bpm · <b>" + cur.phase + "</b>" + (b ? " · " + Math.round(b.SA[1]) + "/" + Math.round(b.SA[0]) + " mmHg" : ""); });
// Tell the page around us how tall we are.
const post = () => parent !== window && parent.postMessage({ folio: "heart", h: document.documentElement.scrollHeight }, "*");
new ResizeObserver(post).observe(document.body); addEventListener("load", post); post();
</script>
