<style>
/*CSS*/
/* A plate on its own, for embedding in the cover page. */
html, body { background: var(--paper); }
body { padding: 0; }
.plate { outline-offset: -1px; padding: 14px 14px 10px; }
</style>
<figure class="plate" style="margin:0">
  <div class="corners"><span class="tl">{{TL}}</span><span class="tr"><span class="cap">{{CAP}}</span><span class="views" id="views" role="group" aria-label="View"></span><span class="tools" id="tools" role="group" aria-label="Tools"><button type="button" data-t="loupe" aria-pressed="false">Loupe</button></span></span></div>
  <div class="fig" id="plate" tabindex="0" role="img" aria-label="{{ARIA}}">
    <svg id="plate-svg" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
  </div>
  <div class="corners b"><span class="bl">{{HINT}}</span><span class="br" id="readout" aria-live="off"></span></div>
</figure>

<script>
/*READOUT*/
// Tell the page around us how tall we are.
const post = () => parent !== window && parent.postMessage({ folio: "{{ID}}", h: document.documentElement.scrollHeight }, "*");
new ResizeObserver(post).observe(document.body); addEventListener("load", post); post();
</script>
